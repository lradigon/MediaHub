name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test backend/MediaHub.slnx -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile pipeline --profile public config --quiet
      - run: docker build --target api -t mediahub-api backend
      - run: docker build --target worker -t mediahub-worker backend
      - run: docker build -t mediahub-web frontend
      - run: docker run --rm -v "$PWD/scripts:/scripts:ro" --entrypoint bash mediahub-api -n /scripts/mediahub.sh